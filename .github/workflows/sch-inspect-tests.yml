
name: Hardware-Copilot Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kicad_golden_project:
        description: "Optional root .kicad_sch path for golden tests"
        required: false
        type: string

permissions:
  contents: read

jobs:
  sch-synthetic:
    name: SCH synthetic regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SCH tests
        run: >-
          python .claude/skills/sch-inspect/tests/run_tests.py
          --pattern test_query_sch.py --label synthetic

  sch-golden:
    name: SCH golden tests (optional)
    runs-on: ubuntu-latest
    env:
      KICAD_GOLDEN_PROJECT: ${{ inputs.kicad_golden_project || vars.KICAD_GOLDEN_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Run SCH golden tests
        run: >-
          python .claude/skills/sch-inspect/tests/run_tests.py
          --pattern test_query_sch_golden.py --label golden

  pcb-synthetic:
    name: PCB synthetic regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PCB tests
        run: >-
          python -m unittest discover
          -s .claude/skills/pcb-inspect/tests
          -p "test_query_pcb.py" -v
