name: Hardware-Copilot Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kicad_golden_project:
        description: "Optional root .kicad_sch path for project-specific golden tests"
        required: false
        type: string

permissions:
  contents: read

jobs:
  sch-synthetic:
    name: SCH synthetic regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run self-contained SCH synthetic tests
        run: >-
          python .claude/skills/sch-inspect/tests/run_tests.py
          --pattern test_query_sch.py --label synthetic

  sch-golden:
    name: SCH golden tests (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KICAD_GOLDEN_PROJECT: ${{ inputs.kicad_golden_project || vars.KICAD_GOLDEN_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run opt-in SCH golden tests
        run: >-
          python .claude/skills/sch-inspect/tests/run_tests.py
          --pattern test_query_sch_golden.py --label golden

  pcb-synthetic:
    name: PCB synthetic regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run self-contained PCB synthetic tests
        run: >-
          python -m unittest discover
          -s .claude/skills/pcb-inspect/tests
          -p test_query_pcb.py -v
